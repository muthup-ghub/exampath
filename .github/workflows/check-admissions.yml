name: Check official admission sources

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check official source pages
        run: node scripts/check-admissions.js

      - name: Commit verification state
        run: |
          git config user.name "ExamPath Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-state.json
          if git diff --cached --quiet; then
            echo "No verification-state changes to commit."
          else
            git commit -m "Update official source verification state"
            git push
          fi
